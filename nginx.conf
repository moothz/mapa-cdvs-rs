# Configuração de Rate Limiting para proteção contra DoS/Spam
limit_req_zone $binary_remote_addr zone=api_dynamic:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_suggestions:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Detecção de IP Real via Cloudflare (Tunnel ou Proxy)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Otimização de I/O e cache de arquivos abertos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compressão Gzip Otimizada
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Headers de Segurança Padrão (Server-level)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; frame-ancestors 'self';" always;

    # Documentação Swagger / OpenAPI
    location /api/docs {
        default_type text/html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /api/docs/index.html =404;
    }

    # Raiz da API e Especificação OpenAPI
    location = /api {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /api/index.json =404;
    }

    location = /api/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /api/index.json =404;
    }

    location = /api/openapi.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /api/openapi.json =404;
    }

    # Endpoints Dinâmicos da API Pública (Busca Livre e Proximidade com Rate Limiting)
    location ~ ^/api/cdvs/(search|nearby|proximos)$ {
        limit_req zone=api_dynamic burst=10 nodelay;

        proxy_pass http://scraper:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_true_client_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Endpoint de Sugestão de Contatos (com Rate Limiting estrito)
    location = /api/suggestions {
        limit_req zone=api_suggestions burst=5 nodelay;

        proxy_pass http://scraper:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_true_client_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Painel Administrativo e API de Moderação (Basic Auth gerenciado pelo servidor backend)
    location ~ ^/(admin|api/admin) {
        proxy_pass http://scraper:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_true_client_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Endpoints Estáticos da API Pública
    location = /api/cdvs {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/cdvs.json;
    }

    location = /api/cdvs.json {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/cdvs.json;
    }

    location = /api/cities {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/cities_rs.json;
    }

    location = /api/cities.json {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/cities_rs.json;
    }

    location = /api/metadata {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/metadata.json;
    }

    location = /api/metadata.json {
        default_type application/json;
        limit_req zone=api_general burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/data/metadata.json;
    }

    # Dados JSON compatibilidade direta (/data/)
    location /data/ {
        alias /var/data/;
        limit_req zone=api_general burst=20 nodelay;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type application/json;
    }

    # Arquivos estáticos da aplicação
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets de frontend (CSS e JS com revalidação imediata para evitar cache preso)
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache de imagens e fontes estáticas
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /index.html;
}

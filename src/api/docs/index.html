<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Pública - Mapa CDVs RS (Documentação Swagger)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui.css">
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar-header {
      background: linear-gradient(135deg, #1B5E20 0%, #0D3C12 100%);
      color: #FFFFFF;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      border-bottom: 3px solid #F59E0B;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .topbar-badge {
      background-color: #F59E0B;
      color: #1F2937;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .topbar-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .topbar-link {
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      transition: background-color 0.15s;
    }
    .topbar-link:hover {
      background: rgba(255, 255, 255, 0.24);
      text-decoration: none;
    }
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-ui .info {
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <header class="topbar-header">
    <div class="topbar-title">
      <span>🚗 Mapa CDVs RS</span>
      <span class="topbar-badge">OpenAPI / Swagger</span>
    </div>
    <div class="topbar-actions">
      <a href="/api" class="topbar-link" target="_blank">
        <span>📄 JSON Raiz (/api)</span>
      </a>
      <a href="/api/openapi.json" class="topbar-link" target="_blank">
        <span>⚙️ openapi.json</span>
      </a>
      <a href="/" class="topbar-link">
        <span>🗺️ Voltar ao Mapa</span>
      </a>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        showExtensions: true,
        showCommonExtensions: true
      });
    };
  </script>
</body>
</html>

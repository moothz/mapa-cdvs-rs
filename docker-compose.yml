services:
  web:
    image: nginx:alpine
    container_name: mapa_cdvs_web
    restart: unless-stopped
    ports:
      - "${PORT:-3740}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/usr/share/nginx/html:ro
      - ./data:/var/data:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapa_cdvs_scraper
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
    environment:
      - SCRAPE_CYCLE_DAYS=${SCRAPE_CYCLE_DAYS:-4}
      - SCRAPE_BOOTSTRAP_ON_START=${SCRAPE_BOOTSTRAP_ON_START:-false}
      - GEOCODER_CONTACT_EMAIL=${GEOCODER_CONTACT_EMAIL:-""}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-"MapaCDVsRS/1.0 (+https://github.com/moothz/mapa-cdvs-rs)"}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - web

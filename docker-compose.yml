services:
  web:
    image: nginx:alpine
    container_name: mapa_cdvs_web
    restart: unless-stopped
    ports:
      - "${PORT:-3740}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/usr/share/nginx/html:ro
      - ./data:/var/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapa_cdvs_scraper
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - SCRAPE_CYCLE_DAYS=${SCRAPE_CYCLE_DAYS:-4}
      - SCRAPE_BOOTSTRAP_ON_START=${SCRAPE_BOOTSTRAP_ON_START:-false}
    depends_on:
      - web

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mapa_cdvs_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-""}
    depends_on:
      - web
    profiles:
      - tunnel
